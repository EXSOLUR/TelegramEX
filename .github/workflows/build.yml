name: Build and Release Morphe Patches

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Unpack TelegramEX ZIP & Read Version
        id: ver
        run: |
          if [ -f "TelegramEX-Patches.zip" ]; then
            rm -f patches/src/main/kotlin/app/template/patches/telegram/HideChatsPatch.kt
            rm -f extensions/extension/src/main/java/app/template/extension/TelegramHideHelper.java
            unzip -o TelegramEX-Patches.zip
          fi
          if [ -f "version.txt" ]; then
            APP_VER=$(tr -d '[:space:]' < version.txt)
          else
            APP_VER="0.1"
          fi
          echo "version=$APP_VER" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build -Pversion="${{ steps.ver.outputs.version }}" -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Clean .mpp Output
        run: |
          mkdir -p release-out
          find . -path "*/build/libs/*.mpp" ! -name "*-javadoc*" ! -name "*-sources*" -exec cp {} release-out/ \;
          ls -la release-out/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "TelegramEX v${{ steps.ver.outputs.version }}"
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: "release-out/*.mpp"

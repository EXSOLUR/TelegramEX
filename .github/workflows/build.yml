name: Build and Release Morphe Patches

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build .mpp
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Telegram Patches v1.0.${{ github.run_number }}"
          prerelease: true # Normal sürüm (Latest) için false yap
          files: "**/build/libs/*.mpp"
